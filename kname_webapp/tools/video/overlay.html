<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>overlay</title>
<!-- 영상 자막 레이어. tools/video/record.py 가 이 페이지를 1080×1920 투명 배경으로 띄우고,
     매 프레임 window.render(t) 를 불러 PNG 로 찍은 뒤 앱 화면 녹화 위에 얹는다.
     같은 origin(127.0.0.1:5078)에서 route 로 서빙되므로 /static 의 서체를 그대로 쓴다.
     디자인 원칙: 앱 카드와 같은 두 색(먹·종이)만, 세리프 제목 + 산세리프 본문, 틱톡 UI 가
     가리는 위 180px·아래 420px·오른쪽 150px 은 비운다. -->
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/notoserifkr.css">
<style>
  :root{
    --ink:#1a1a1a; --ink-soft:#6e6e6e; --ink-faint:#a8a8a8; --paper:#f9f4e7; --card:#fdfbf5;
    --green:#0F6E56; --green-bg:#E1F5EE;
    --serif:'EngSerif','Noto Serif KR',Georgia,serif;
    --kr:'Noto Serif KR',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  }
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent;}
  body{font-family:var(--sans);color:var(--ink);}
  .layer{position:absolute;inset:0;opacity:0;}
  .full{background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 90px;box-sizing:border-box;}
  .full .eyebrow{font-family:var(--sans);font-size:38px;letter-spacing:.32em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:34px;}
  .full .big{font-family:var(--serif);font-style:italic;font-size:210px;line-height:1;letter-spacing:-.01em;}
  .full .sub{font-family:var(--serif);font-size:66px;line-height:1.25;margin-top:52px;max-width:900px;}
  .full .hand{font-size:96px;margin-top:40px;}
  .rule{width:120px;height:2px;background:var(--ink);margin:56px auto 0;}
  .pill{position:absolute;top:186px;left:50%;transform:translateX(-50%);font-size:30px;letter-spacing:.3em;text-transform:uppercase;
        color:var(--ink-soft);background:rgba(249,244,231,.92);border:1.5px solid rgba(26,26,26,.18);border-radius:999px;padding:16px 34px;white-space:nowrap;}
  .cap{position:absolute;left:110px;right:110px;top:1135px;height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .w{display:inline-block;will-change:transform,opacity;}
  /* 발음 */
  .say{display:flex;align-items:center;gap:26px;}
  .say .rom{font-family:var(--serif);font-size:88px;letter-spacing:.02em;}
  .bars{display:flex;align-items:center;gap:9px;height:70px;}
  .bars i{display:block;width:9px;border-radius:5px;background:var(--ink);height:14px;}
  /* 트리비아 카드 */
  .triv{position:absolute;left:80px;right:80px;top:1010px;background:var(--card);border:1.5px solid rgba(26,26,26,.22);border-radius:8px;
        box-shadow:0 30px 80px rgba(60,50,30,.18);padding:56px 64px 60px;box-sizing:border-box;text-align:left;}
  .triv .lab{font-size:28px;letter-spacing:.32em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:26px;}
  .triv .tx{font-family:var(--serif);font-size:50px;line-height:1.38;color:var(--ink);}
  .triv .tx .kr{font-family:var(--kr);font-weight:600;}
  .triv .tx b{font-weight:600;}
</style>
</head>
<body>
<div class="layer full" id="hook">
  <div class="eyebrow" id="hookEye"></div>
  <div class="big" id="hookBig"></div>
  <div class="sub" id="hookSub"></div>
</div>
<div class="layer" id="ep"><div class="pill" id="epTx"></div></div>
<div class="layer" id="say"><div class="cap"><div class="say"><span class="rom" id="sayRom"></span><span class="bars" id="bars"></span></div></div></div>
<div class="layer" id="triv"><div class="triv"><div class="lab" id="trivLab"></div><div class="tx" id="trivTx"></div></div></div>
<div class="layer full" id="outro">
  <div class="big" id="outBig" style="font-style:normal;font-size:150px;"></div>
  <div class="sub" id="outSub"></div>
  <div class="hand" id="outHand"></div>
</div>

<script>
(function(){
  var S = null, T = null;   // script, timeline(초)
  var $ = function(id){ return document.getElementById(id); };
  var clamp = function(x){ return x < 0 ? 0 : x > 1 ? 1 : x; };
  var easeOut = function(p){ p = clamp(p); return 1 - Math.pow(1 - p, 3); };
  var easeIO = function(p){ p = clamp(p); return p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2; };
  // t 가 [t0, t1) 안에 있으면 들어오고(dIn) 나갈 때(dOut) 사라진다. 반환: 0..1 표시 정도(음수면 숨김)
  function vis(t, t0, t1, dIn, dOut){
    if(t < t0 || t >= t1) return 0;
    var a = easeOut((t - t0) / (dIn || .35));
    var b = (t1 - t) < (dOut || .3) ? easeOut((t1 - t) / (dOut || .3)) : 1;
    return Math.min(a, b);
  }
  function setLayer(el, v, rise){
    el.style.opacity = v;
    el.style.display = v > 0 ? 'block' : 'none';
    if(rise !== undefined) el.style.transform = 'translateY(' + ((1 - v) * rise) + 'px)';
  }
  // 낱말 단위 등장: 각 .w 가 순서대로 떠오른다
  function words(container, t, t0, step, rise){
    var ws = container.querySelectorAll('.w');
    for(var i = 0; i < ws.length; i++){
      var p = easeOut((t - t0 - i * (step || .07)) / .32);
      ws[i].style.opacity = p; ws[i].style.transform = 'translateY(' + ((1 - p) * (rise || 22)) + 'px)';
    }
  }
  function wrapWords(text){
    return text.split(' ').map(function(w){ return '<span class="w">' + w + '</span>'; }).join(' ');
  }

  window.setup = function(script, timeline){
    S = script; T = timeline;
    $('hookEye').innerHTML = wrapWords(S.hook.eyebrow || '');
    $('hookBig').innerHTML = '<span class="w">' + S.hook.big + '</span>';
    $('hookSub').innerHTML = wrapWords(S.hook.sub || '');
    $('epTx').textContent = S.ep || '';
    $('sayRom').textContent = '🔊 ' + S.rom;
    $('bars').innerHTML = '<i></i><i></i><i></i><i></i><i></i><i></i>';
    $('trivLab').textContent = S.trivia.label || 'Did you know';
    $('trivTx').innerHTML = S.trivia.html;
    $('outBig').innerHTML = '<span class="w">' + S.outro.big + '</span>';
    $('outSub').innerHTML = wrapWords(S.outro.sub || '');
    $('outHand').innerHTML = '<span class="w">' + (S.outro.hand || '') + '</span>';
    return document.fonts.ready.then(function(){ return true; });
  };

  window.render = function(t){
    // ── 훅: 시작 ~ 타이핑 직전
    var hookEnd = T.type - .15;
    var v = vis(t, T.start - 1, hookEnd, .01, .35);
    setLayer($('hook'), v);
    if(v > 0){ words($('hookEye'), t, T.start + .05, .05, 14); words($('hookBig'), t, T.start + .25, 0, 40); words($('hookSub'), t, T.start + .7, .06, 18); }
    // ── 회차 표시: 타이핑 ~ 결과 직전
    v = vis(t, T.type - .15, T.submit + .35, .3, .25);
    setLayer($('ep'), v, -16);
    // ── 발음: say ~ say+dur
    var sayEnd = T.say + (T.saydur || 1.2) + .35;
    v = vis(t, T.say, sayEnd, .2, .25);
    setLayer($('say'), v);
    if(v > 0){
      var bs = $('bars').children, tt = t - T.say, on = tt < (T.saydur || 1.2);
      for(var j = 0; j < bs.length; j++){
        var h = on ? 18 + 44 * Math.abs(Math.sin(tt * 11 + j * 1.7)) * (0.5 + 0.5 * Math.abs(Math.sin(tt * 3.1 + j))) : 14;
        bs[j].style.height = h + 'px';
      }
    }
    // ── 트리비아 카드: 그 다음 ~ 아웃트로 직전
    var trStart = T.done + .15, trEnd = T.outro - .1;
    v = vis(t, trStart, trEnd, .45, .3);
    setLayer($('triv'), v, 60);
    // ── 아웃트로
    v = vis(t, T.outro, T.outro + 60, .35, 1);
    setLayer($('outro'), v);
    if(v > 0){ words($('outBig'), t, T.outro + .1, 0, 34); words($('outSub'), t, T.outro + .55, .06, 18); words($('outHand'), t, T.outro + 1.1, 0, 30); }
    return true;
  };
})();
</script>
</body>
</html>
